spring.application.name=notificacao

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password

rabbitmq.exchange.name=pedidos.v1.pedidod-criado
rabbitmq.exchange.dlx.name=pedidos.v1.pedidos-criado.dlx

rabbitmq.queue.name=pedidos.v1.pedidos-criado.gerar-notificacao
rabbitmq.queue.dlq.name=pedidos.v1.pedidos-criado.gerar-notificacao.dlq


#SPRING MAIL
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

#REENVIO DE MENSAGENS
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=5s
spring.rabbitmq.listener.simple.retry.multiplier=2.0